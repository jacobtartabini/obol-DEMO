<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>Obol Accounting</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Obol is a fast, private accounting system for single-member LLCs. Track income, expenses, and generate financial reports." />
    <meta name="author" content="Tartabini Enterprises LLC" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Obol" />
    <link rel="apple-touch-icon" href="/logo2.png" />

    <meta property="og:title" content="Obol Accounting" />
    <meta property="og:description" content="By Tartabini Enterprises LLC" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Splash shown until React hydrates */
      #obol-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0f172a; color: #e2e8f0;
        font-family: "DM Sans", system-ui, sans-serif;
        transition: opacity 300ms ease;
      }
      #obol-splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 20px 60px -10px rgba(0,0,0,0.5); object-fit: contain; background: #0f172a; }
      #obol-splash .label { margin-top: 20px; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.85; }
      #obol-splash .sub { margin-top: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; opacity: 0.5; }
      .splash-hidden { opacity: 0; pointer-events: none; }
      html, body { background: #0f172a; }
      /* Safe-area helpers for installed PWA on iOS */
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>

  <body>
    <div id="obol-splash">
      <img src="/favicon.png" alt="Obol" />
      <div class="label">Obol</div>
      <div class="sub">Accounting</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
